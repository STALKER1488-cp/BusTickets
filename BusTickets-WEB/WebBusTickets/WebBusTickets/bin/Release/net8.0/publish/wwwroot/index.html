<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автовокзал — Веб-система</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f5f7fa;
            color: #333;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 2.2fr 1.5fr 2.5fr;
            gap: 15px;
        }

        .panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }

        h3 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        /* Рейсы */
        .search-box, .admin-input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .trip-item {
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #eee;
            border-radius: 6px;
            cursor: pointer;
        }

            .trip-item:hover {
                background-color: #f0f4f8;
            }

            .trip-item.selected {
                background-color: #e2ecf7;
                border-color: #2b579a;
            }

        .price {
            color: green;
            font-weight: bold;
        }

        /* Схема мест */
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .seat {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid;
        }

            .seat.available {
                background-color: #e2f0d9;
                border-color: #385723;
            }

            .seat.booked {
                background-color: #fce4d6;
                border-color: #c65911;
                cursor: not-allowed;
                opacity: 0.6;
            }

            .seat.selected {
                background-color: #fff2cc;
                border-color: #d6b656;
            }

        /* Кнопки и формы */
        .btn {
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            border: none;
        }

        .btn-blue {
            background: #1e90ff;
            color: white;
        }

        .btn-orange {
            background: #ff4500;
            color: white;
        }

        .btn-gray {
            background: #dcdcdc;
            color: #333;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            color: #666;
        }

        /* Таблица */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .hidden {
            display: none;
        }

        .admin-bg {
            background-color: #fff2e6;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h2>Автовокзал — Система бронирования</h2>
        <div>
            <strong>Режим работы: </strong>
            <button id="toggleAdminBtn" class="btn-gray" style="width:140px; width: auto; padding: 6px 12px;" onclick="toggleAdminMode()">Админ</button>
        </div>
    </div>

    <div class="container">
        <!-- 1. РЕЙСЫ -->
        <div class="panel">
            <h3>1. Рейсы</h3>
            <label style="color:gray; font-size:12px;">Поиск маршрута:</label>
            <input type="text" id="searchQuery" class="search-box" oninput="loadTrips()">
            <div id="tripsList">Загрузка...</div>
        </div>

        <!-- 2. ВЫБОР МЕСТА -->
        <div class="panel">
            <h3>2. Выберите место</h3>
            <div id="seatsContainer" class="seats-grid"></div>
        </div>

        <!-- 3. ДЕЙСТВИЯ И ТАБЛИЦА -->
        <div>
            <!-- Панель Кассира -->
            <div id="cashierPanel" class="panel" style="margin-bottom: 15px;">
                <h3>3. Оформление билета</h3>
                <label>ФИО Пассажира:</label>
                <input type="text" id="passengerName" class="search-box" oninput="validateCashierForm()">
                <p id="selectedSeatInfo" style="font-weight:bold; margin: 8px 0;">Место не выбрано</p>
                <button id="buyBtn" class="btn btn-blue" onclick="buyTicket()" disabled>Купить билет</button>
            </div>

            <!-- Панель Администратора -->
            <div id="adminPanel" class="panel admin-bg hidden" style="margin-bottom: 15px;">
                <h3>Панель Администратора</h3>
                <label>Направление маршрута:</label>
                <input type="text" id="adminRoute" class="admin-input">

                <label>Новое время отправления:</label>
                <input type="datetime-local" id="adminTime" class="admin-input">

                <label>Стоимость билета (₽):</label>
                <input type="number" id="adminPrice" class="admin-input">

                <button id="saveTripBtn" class="btn btn-orange" onclick="saveTripChanges()" disabled>Сохранить изменения рейса</button>
                <button class="btn btn-blue" style="margin-top:10px;" onclick="createNewTrip()">Добавить новый рейс</button>
                <button id="deleteTripBtn" class="btn btn-gray" style="margin-top:10px; background:#ffcccb; color:red;" onclick="deleteTrip()" disabled>Отменить выбранный рейс</button>
            </div>

            <!-- История проданных билетов -->
            <div class="panel">
                <h3>Проданные билеты</h3>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>№ Билета</th>
                                <th>Маршрут</th>
                                <th>Дата отправления</th>
                                <th>Актуальность</th>
                                <th>Пассажир</th>
                                <th>Место</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        var allTrips = [];
        var isAdminMode = false;
        var selectedTripId = null;
        var selectedSeatNumber = null;

        // 1. Загрузка рейсов с сервера
        async function loadTrips() {
            var queryField = document.getElementById('searchQuery');
            var query = queryField ? queryField.value : '';

            try {
                var response = await fetch('/api/trips?search=' + encodeURIComponent(query));
                if (!response.ok) throw new Error('Ошибка: ' + response.status);

                allTrips = await response.json();
                renderTrips();
                loadTickets();

                if (selectedTripId) {
                    var currentTrip = allTrips.find(function (t) { return t.id === selectedTripId; });
                    if (currentTrip) renderSeats(currentTrip);
                }
            } catch (error) {
                console.error("Критическая ошибка fetch:", error);
                var list = document.getElementById('tripsList');
                if (list) list.innerHTML = '<span style="color:red;">Ошибка соединения</span>';
            }
        }

        // 2. Загрузка проданных билетов в таблицу
        async function loadTickets() {
            try {
                var response = await fetch('/api/tickets');
                if (!response.ok) throw new Error('Ошибка: ' + response.status);

                var tickets = await response.json();
                var tbody = document.getElementById('ticketsTableBody');
                tbody.innerHTML = '';

                var now = new Date();

                tickets.forEach(function (ticket) {
                    var tr = document.createElement('tr');
                    var departureField = ticket.DepartureTime || ticket.departureTime;
                    var departureDate = departureField ? new Date(departureField) : null;

                    var formattedDate = '—';
                    var statusBadge = '—';

                    if (departureDate && !isNaN(departureDate.getTime())) {
                        formattedDate = departureDate.toLocaleString('ru-RU', {
                            day: '2-digit',
                            month: '2-digit',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        var isActual = departureDate >= now;
                        statusBadge = isActual
                            ? '<span style="color: green; font-weight: bold;">Предстоит</span>'
                            : '<span style="color: gray; font-style: italic;">Архивный</span>';
                    }

                    var tktNum = ticket.TicketNumber || ticket.ticketNumber || '—';
                    var tktRoute = ticket.Route || ticket.route || '—';
                    var tktPassenger = ticket.PassengerName || ticket.passengerName || '—';
                    var tktSeat = ticket.SeatNumber || ticket.seatNumber || '—';

                    tr.innerHTML = '<td>' + tktNum + '</td>' +
                        '<td>' + tktRoute + '</td>' +
                        '<td>' + formattedDate + '</td>' +
                        '<td>' + statusBadge + '</td>' +
                        '<td>' + tktPassenger + '</td>' +
                        '<td>' + tktSeat + '</td>';
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Критическая ошибка при загрузке билетов:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', function () {
            loadTrips();
        });

        // 3. Отрисовка списка доступных рейсов в левой панели
        function renderTrips() {
            var container = document.getElementById('tripsList');
            if (!container) return;

            if (allTrips.length === 0) {
                container.innerHTML = '<p style="color:gray; font-style:italic;">Рейсы не найдены</p>';
                return;
            }

            var html = '';
            allTrips.forEach(function (trip) {
                var tripRoute = trip.route || trip.Route;
                var tripPrice = trip.price || trip.Price;
                var tripTime = trip.departureTime || trip.DepartureTime;
                var date = new Date(tripTime).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                var className = 'trip-item' + (trip.id === selectedTripId ? ' selected' : '');

                html += '<div class="' + className + '" onclick="selectTrip(' + trip.id + ')">' +
                    '<strong>' + tripRoute + '</strong><br>' +
                    '<span style="font-size:12px; color:gray;">Отправление: ' + date + '</span><br>' +
                    '<span class="price">Цена: ' + tripPrice + ' ₽</span>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        // 4. Выбор конкретного рейса
        function selectTrip(id) {
            selectedTripId = id;
            selectedSeatNumber = null;
            renderTrips();

            var trip = allTrips.find(function (t) { return t.id === id; });
            if (!trip) return;

            var routeInput = document.getElementById('adminRoute');
            var priceInput = document.getElementById('adminPrice');
            var timeInput = document.getElementById('adminTime');

            if (routeInput) routeInput.value = trip.route || trip.Route;
            if (priceInput) priceInput.value = trip.price || trip.Price;
            if (timeInput) {
                var tripTime = trip.departureTime || trip.DepartureTime;
                var d = new Date(tripTime);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                timeInput.value = d.toISOString().slice(0, 16);
            }

            var saveBtn = document.getElementById('saveTripBtn');
            var deleteBtn = document.getElementById('deleteTripBtn');
            if (saveBtn) saveBtn.disabled = false;
            if (deleteBtn) deleteBtn.disabled = false;

            renderSeats(trip);
            var seatInfo = document.getElementById('selectedSeatInfo');
            if (seatInfo) seatInfo.innerText = "Место не выбрано";
            validateCashierForm();
        }

        // 5. Отрисовка схемы мест автобуса
        function renderSeats(trip) {
            var seatsContainer = document.getElementById('seatsContainer');
            if (!seatsContainer) return;

            var seatsList = trip.seats || trip.Seats || [];
            var html = '';
            seatsList.forEach(function (seat) {
                var sNum = seat.number || seat.Number;
                var sBooked = seat.isBooked || seat.IsBooked;
                var isSel = (sNum === selectedSeatNumber);
                var className = 'seat ' + (sBooked ? 'booked' : (isSel ? 'selected' : 'available'));

                html += '<div class="' + className + '" onclick="selectSeat(' + sNum + ', this, ' + sBooked + ')">' +
                    sNum +
                    '</div>';
            });
            seatsContainer.innerHTML = html;
        }

        function selectSeat(num, el, isBooked) {
            if (isBooked) return;
            document.querySelectorAll('.seat').forEach(function (s) {
                if (!s.classList.contains('booked')) s.className = 'seat available';
            });
            el.classList.add('selected');
            selectedSeatNumber = num;
            var seatInfo = document.getElementById('selectedSeatInfo');
            if (seatInfo) seatInfo.innerText = "Выбранное место: " + num;
            validateCashierForm();
        }

        function validateCashierForm() {
            var input = document.getElementById('passengerName');
            var buyBtn = document.getElementById('buyBtn');
            if (!input || !buyBtn) return;
            var name = input.value.trim();
            buyBtn.disabled = !(name && selectedSeatNumber);
        }

        function toggleAdminMode() {
            isAdminMode = !isAdminMode;
            var btn = document.getElementById('toggleAdminBtn');
            var cashierPanel = document.getElementById('cashierPanel');
            var adminPanel = document.getElementById('adminPanel');

            if (!btn) return;

            if (isAdminMode) {
                btn.innerText = "Кассир";
                btn.className = "btn-blue";
                if (cashierPanel) cashierPanel.classList.add('hidden');
                if (adminPanel) adminPanel.classList.remove('hidden');
            } else {
                btn.innerText = "Администратор";
                btn.className = "btn-gray";
                if (cashierPanel) cashierPanel.classList.remove('hidden');
                if (adminPanel) adminPanel.classList.add('hidden');
            }
        }

        // 6. Покупка билета кассиром
        async function buyTicket() {
            var name = document.getElementById('passengerName').value.trim();
            try {
                var response = await fetch('/api/tickets/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tripId: selectedTripId, seatNumber: selectedSeatNumber, passengerName: name })
                });
                if (response.ok) {
                    alert("Билет успешно оформлен!");
                    document.getElementById('passengerName').value = '';
                    selectedSeatNumber = null;
                    await loadTrips();
                }
            } catch (error) {
                alert("Ошибка выполнения операции.");
            }
        }
        // 7. Сохранение изменений существующего рейса (Админ)
        async function saveTripChanges() {
            if (!selectedTripId) return;
            var route = document.getElementById('adminRoute').value.trim();
            var time = document.getElementById('adminTime').value;
            var price = parseFloat(document.getElementById('adminPrice').value);
            try {
                var response = await fetch('/api/admin/trips/' + selectedTripId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route: route, departureTime: time, price: price })
                });
                if (response.ok) {
                    alert("Рейс успешно изменен!");
                    await loadTrips();
                }
            } catch (error) {
                alert("Ошибка при сохранении рейса.");
            }
        }
        // 8. Создание нового рейса (Админ)
        async function createNewTrip() {
            var route = document.getElementById('adminRoute').value.trim();
            var time = document.getElementById('adminTime').value;
            var price = parseFloat(document.getElementById('adminPrice').value);
            if (!route || !time || isNaN(price)) {
                alert("Заполните все поля администратора перед добавлением рейса!");
                return;
            }
            try {
                var response = await fetch('/api/admin/trips', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route: route, departureTime: time, price: price })
                });
                if (response.ok) {
                    alert("Новый рейс успешно добавлен!");
                    await loadTrips();
                }
            } catch (error) {
                alert("Ошибка при создании рейса.");
            }
        }
        // 9. Отмена/Удаление рейса (Админ)
        async function deleteTrip() {
            if (!selectedTripId || !confirm("Вы уверены, что хотите отменить этот рейс?")) return;
            try {
                var response = await fetch('/api/admin/trips/' + selectedTripId, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert("Рейс успешно отменен!");
                    selectedTripId = null;
                    await loadTrips();
                }
            } catch (error) {
                alert("Ошибка при удалении рейса.");
            }
        }
    </script>
</body>
</html>
